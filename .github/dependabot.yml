version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Majors are done deliberately by hand: across this stack they move in
    # lockstep (vite with @vitejs/plugin-vue, typescript with typescript-eslint)
    # and a lone major bump only produces an unresolvable peer conflict.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      vue:
        patterns:
          - 'vue'
          - 'vue-*'
          - '@vue/*'
          - 'pinia'
      build:
        patterns:
          - 'vite'
          - 'vite-*'
          - '@vitejs/*'
      typescript:
        patterns:
          - 'typescript'
          - 'typescript-*'
          - 'vue-tsc'
          - '@types/*'
      lint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - 'globals'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@vue/test-utils'
          - '@playwright/*'
          - '@axe-core/*'
          - 'jsdom'
          - 'fake-indexeddb'
          - 'wait-on'
      budgets:
        patterns:
          - 'size-limit'
          - '@size-limit/*'
          - '@lhci/*'
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: 'ci'
