version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      vue:
        patterns:
          - 'vue'
          - 'vue-*'
          - '@vitejs/*'
          - 'pinia'
      tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript*'
          - 'prettier'
          - '@types/*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@vue/test-utils'
          - '@playwright/*'
          - '@axe-core/*'
          - 'jsdom'
          - 'fake-indexeddb'
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
